<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#912dbf"/>
      <stop offset="100%" style="stop-color:#7a24a8"/>
    </linearGradient>
    <pattern id="pattern" patternUnits="userSpaceOnUse" width="200" height="200">
      <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
      <circle cx="100" cy="100" r="40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5"/>
      <circle cx="100" cy="100" r="120" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#pattern)"/>
  
  <!-- Logo text -->
  <text x="600" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="72" font-weight="800" fill="white" letter-spacing="4">WinIt</text>
  
  <!-- Divider -->
  <rect x="540" y="270" width="120" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>
  
  <!-- Tagline -->
  <text x="600" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="500" fill="rgba(255,255,255,0.85)" letter-spacing="6">SHAPING SUCCESS STORIES</text>
  
  <!-- Subtitle -->
  <text x="600" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="rgba(255,255,255,0.5)" letter-spacing="2">INFLUENCER MARKETING · BRAND STORYTELLING · CREATIVE STRATEGY</text>
  
  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="rgba(0,0,0,0.15)"/>
  <text x="600" y="612" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.5)">winitmedia.com</text>
</svg>
